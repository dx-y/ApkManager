<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>APK 管家</title>
<style>
:root{
  /* ===== 浅色玻璃拟态（固定浅色，参考 uiverse.io 组件风格） ===== */
  color-scheme: light;
  --bg1:#eef2f9; --bg2:#dde6f3;
  --ink:#1d2635; --dim:#5d6b86; --faint:#8a96ad;
  --green:#10b981; --green-deep:#059669;
  --red:#f43f5e; --red-deep:#e11d48;
  --blue:#3b82f6; --blue-deep:#2563eb;
  --amber:#f59e0b;
  --violet:#8b5cf6;
  --card-border:rgba(255,255,255,.78);
  --card-bg:rgba(255,255,255,.66);
  --card-inset:rgba(255,255,255,.95);
  --shadow-soft:rgba(31,45,72,.12);
  --shadow-deep:rgba(31,45,72,.20);
  --btn-bg:rgba(255,255,255,.6);
  --btn-inset:rgba(255,255,255,.92);
  --track-bg:rgba(29,38,53,.10);
  --switch-off:#c3cde0;
  --panel-bg:rgba(255,255,255,.72);
  --toast-bg:rgba(255,255,255,.92);
  --toast-inset:rgba(255,255,255,.98);
  --scroll-thumb:rgba(29,38,53,.22);
  --header-line:rgba(29,38,53,.08);
  --glow1:rgba(147,197,253,.60);
  --glow2:rgba(196,181,253,.45);
  --glow3:rgba(167,243,208,.50);
  --dz-border:rgba(29,38,53,.30);
  --ripple:rgba(255,255,255,.55);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  color:var(--ink); overflow:hidden; user-select:none;
  display:flex; flex-direction:column;
  background:
    radial-gradient(1200px 500px at 15% -10%, var(--glow1), transparent 60%),
    radial-gradient(900px 480px at 100% 0%,   var(--glow2), transparent 55%),
    radial-gradient(800px 500px at 55% 120%,  var(--glow3), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 70%);
}

/* ============ 顶部标题栏 ============ */
header{
  position:relative; z-index:5; display:flex; align-items:center;
  gap:14px; padding:16px 22px 14px; flex:0 0 auto;
}
.logo{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#38bdf8,#6366f1 55%,#a855f7);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;color:#fff;
  box-shadow:0 8px 24px rgba(99,102,241,.45), inset 0 1px 0 rgba(255,255,255,.4);
  animation:logoIn .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes logoIn{0%{transform:scale(.4) rotate(-12deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
header h1{font-size:19px;font-weight:700;letter-spacing:.5px;}
header .sub{font-size:12px;color:var(--dim);margin-top:2px;}

/* 状态胶囊 */
.status{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  background:var(--card-bg); border:1px solid var(--card-border);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-radius:999px; padding:8px 14px 8px 12px;
  box-shadow:0 6px 18px var(--shadow-soft);
}
.dot{width:9px;height:9px;border-radius:50%;background:#4b5479;flex:none;position:relative;}
.dot.on{background:var(--green); animation:pulse 2s infinite;}
.dot.off{background:var(--red); animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 currentColor;}50%{box-shadow:0 0 0 5px transparent;}}
.dot.on{color:rgba(52,211,153,.55);} .dot.off{color:rgba(251,113,133,.55);}
.status .st-txt{font-size:12.5px;color:var(--ink);font-weight:600;}
.status .st-addr{font-size:11px;color:var(--dim);}
.refresh{
  cursor:pointer;border:none;background:transparent;color:var(--dim);
  font-size:14px;transition:transform .45s cubic-bezier(.34,1.56,.64,1), color .2s;line-height:1;
  padding:3px;border-radius:50%;
}
.refresh:hover{color:var(--blue-deep); transform:rotate(180deg) scale(1.15);}
.refresh:active{transform:rotate(180deg) scale(.9);}

/* ===== 启动模拟器按钮（玻璃渐变，离线时醒目，在线时弱化） ===== */
.emu-start{
  cursor:pointer;border:none;border-radius:999px;padding:7px 14px;
  font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#fff;line-height:1;
  background:linear-gradient(135deg,#38bdf8,#6366f1 60%,#a855f7);
  box-shadow:0 5px 14px rgba(99,102,241,.42), inset 0 1px 0 rgba(255,255,255,.35);
  transition:all .3s cubic-bezier(.34,1.56,.64,1); white-space:nowrap;
  position:relative; overflow:hidden;
}
.emu-start::after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
  transition:left .6s; transform:skewX(-20deg);}
.emu-start:hover{transform:translateY(-2px); box-shadow:0 9px 22px rgba(99,102,241,.58), inset 0 1px 0 rgba(255,255,255,.4);}
.emu-start:hover::after{left:160%;}
.emu-start:active{transform:scale(.95);}
.emu-start.on{background:linear-gradient(135deg,#34d399,#10b981); box-shadow:0 5px 14px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.3); cursor:default;}
.emu-start.busy{opacity:.75; pointer-events:none; cursor:default;}
.emu-start .spin-mini{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;
  border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:rot .7s linear infinite; margin-right:5px;}

/* ============ 主卡片区 ============ */
main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:8px 22px 10px;}
.card{
  position:relative; border-radius:20px; padding:20px 22px 18px;
  /* ---- uiverse glassmorphic card：低透明白玻璃 + 白描边 + 重阴影 ---- */
  background:var(--card-bg);
  border:1px solid var(--card-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 46px var(--shadow-deep), inset 0 1px 0 var(--card-inset);
  transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s, border-color .3s;
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;
}
.card:nth-child(1){animation-delay:.06s;}
.card:nth-child(2){animation-delay:.14s;}
@keyframes cardIn{0%{transform:translateY(22px) scale(.97);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
.card:hover{transform:translateY(-4px); box-shadow:0 26px 60px var(--shadow-deep), inset 0 1px 0 var(--card-inset);}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pill{
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;
  letter-spacing:1px; position:relative; overflow:hidden;
}
.pill.green{color:var(--green-deep); background:rgba(52,211,153,.14); box-shadow:inset 0 0 0 1px rgba(52,211,153,.4);}
.pill.red{color:var(--red-deep); background:rgba(251,113,133,.14); box-shadow:inset 0 0 0 1px rgba(251,113,133,.4);}
.card-title{font-size:16px;font-weight:700;}
.card-desc{font-size:11.5px;color:var(--dim);margin-left:auto;}

/* ---- uiverse 玻璃上传按钮（带涟漪） ---- */
.glass-btn{
  position:relative; overflow:hidden; cursor:pointer;
  border:none; border-radius:14px; padding:10px 15px; color:var(--ink);
  background:var(--btn-bg);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 18px var(--shadow-soft), inset 0 0 0 1px var(--btn-inset);
  font-size:12.5px; font-weight:600; letter-spacing:.3px;
  transition:all .3s cubic-bezier(.4,0,.2,1); font-family:inherit;
}
.glass-btn::before{content:""; position:absolute; top:0; left:-100%; width:60%; height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);
  transition:left .55s; transform:skewX(-20deg);}
.glass-btn:hover{transform:translateY(-2px); box-shadow:0 13px 28px var(--shadow-deep), inset 0 0 0 1px var(--btn-inset), 0 0 18px rgba(59,130,246,.12); color:var(--blue-deep);}
.glass-btn:hover::before{left:140%;}
.glass-btn:active{transform:translateY(0) scale(.97); box-shadow:0 4px 12px var(--shadow-soft), inset 0 0 0 1px var(--btn-inset);}
.ripple{position:absolute;border-radius:50%;background:var(--ripple);
  transform:scale(0); animation:rippleAnim .55s ease-out forwards; pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(3.2); opacity:0;}}

/* ============ 拖放区 ============ */
.dropzone{
  position:relative; height:196px; border-radius:16px;
  border:2px dashed var(--dz-border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  cursor:pointer; overflow:hidden;
  transform-origin:center;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1), border-color .25s, background .25s, box-shadow .25s;
}
.card[data-kind="install"] .dropzone:hover{border-color:rgba(16,185,129,.85);}
.card[data-kind="uninstall"] .dropzone:hover{border-color:rgba(244,63,94,.85);}
.dropzone.drag-on{transform:scale(1.04);}
/* 放下瞬间的吸入脉冲 */
.dropzone.drop-bump{animation:bump .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes bump{
  0%{transform:scale(1.07);} 45%{transform:scale(.98);} 75%{transform:scale(1.015);} 100%{transform:scale(1);}
}
.card[data-kind="install"] .dropzone.drag-on{
  border-color:var(--green); background:radial-gradient(circle at 50% 40%, rgba(16,185,129,.18), transparent 70%);
  box-shadow:inset 0 0 44px rgba(16,185,129,.12), 0 0 30px rgba(16,185,129,.10);
}
.card[data-kind="uninstall"] .dropzone.drag-on{
  border-color:var(--red); background:radial-gradient(circle at 50% 40%, rgba(244,63,94,.18), transparent 70%);
  box-shadow:inset 0 0 44px rgba(244,63,94,.12), 0 0 30px rgba(244,63,94,.10);
}
.dz-icon{
  width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);
  background:var(--btn-bg); box-shadow:inset 0 0 0 1px var(--btn-inset);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1), color .25s, box-shadow .25s, background .25s;
}
.dz-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dropzone.drag-on .dz-icon{transform:translateY(-12px) scale(1.18) rotate(-6deg);}
.card[data-kind="install"] .dropzone.drag-on .dz-icon{color:var(--green-deep); box-shadow:0 0 28px rgba(16,185,129,.45), inset 0 0 0 1px rgba(16,185,129,.5);}
.card[data-kind="uninstall"] .dropzone.drag-on .dz-icon{color:var(--red-deep); box-shadow:0 0 28px rgba(244,63,94,.45), inset 0 0 0 1px rgba(244,63,94,.5);}
.dz-main{font-size:14.5px;font-weight:700;color:var(--ink);}
.dz-sub{font-size:11.5px;color:var(--dim);}

/* ============ 任务列表（多任务并行，图标由灰渐亮 + 圆环进度） ============ */
.dz-placeholder{display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:opacity .3s, transform .3s;}
.dz-placeholder.hide{display:none;}
.tlist{display:none; width:100%; flex-direction:column; gap:9px; padding:3px; max-height:168px; overflow-y:auto;}
.tlist.show{display:flex;}
.tlist::-webkit-scrollbar{width:5px;}
.tlist::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;}
/* 任务卡：方块形（像手机桌面安装应用），进度环在方块内部 */
.task-row{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  width:104px; flex:0 0 104px;
  background:var(--btn-bg); border:1px solid var(--card-border);
  border-radius:18px; padding:12px 6px 10px;
  box-shadow:0 5px 14px var(--shadow-soft), inset 0 1px 0 var(--btn-inset);
  transition:opacity .45s, transform .45s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  animation:taskIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes taskIn{0%{transform:scale(.5) translateY(18px);opacity:0;}70%{transform:scale(1.06) translateY(-2px);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
.task-row:hover{transform:translateY(-3px); box-shadow:0 10px 22px var(--shadow-deep), inset 0 1px 0 var(--btn-inset);}
.task-row.leave{opacity:0; transform:translateY(-8px) scale(.88); transition:opacity .45s, transform .45s;}
/* 完成/失败时图标弹跳 */
.task-row.done .ringbox{animation:popOk .6s cubic-bezier(.34,1.56,.64,1);}
.task-row.err .ringbox{animation:shakeX .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes popOk{0%{transform:scale(.7);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
@keyframes shakeX{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
/* 任务图标：圆角"豆腐块"应用图标 + 圆形电量环进度，模拟手机应用安装 */
.ringbox{position:relative; width:64px; height:64px; flex:none;}
.ringbox svg{position:absolute; inset:0; width:64px; height:64px; transform:rotate(-90deg); display:block;}
.ringbox .ring-bg{stroke:var(--track-bg); stroke-width:4;}
.ringbox .ring-fg{
  stroke:var(--theme,#3b82f6); stroke-width:4; stroke-linecap:round;
  fill:none; transition:stroke-dashoffset .4s ease, stroke .4s ease, filter .4s;
}
/* 豆腐块：圆角方形渐变应用图标，像手机桌面图标 */
.ringbox .tofu{
  position:absolute; left:10px; top:10px; width:44px; height:44px; border-radius:15px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,#4cc9f0,#3b82f6 55%,#8b5cf6);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.22), inset 0 2px 3px rgba(255,255,255,.42),
             0 5px 14px rgba(59,130,246,.40);
  transition:background .4s ease, filter .4s ease, opacity .4s ease, box-shadow .4s ease;
}
.ringbox .ring-txt{
  font-size:12.5px; font-weight:800; color:#fff; line-height:1;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
/* 未开始：整块变灰，模拟未启动的桌面图标 */
.task-row.pending .ring-fg{stroke:#9aa7c4; opacity:.5;}
.task-row.pending .tofu{filter:grayscale(.85) brightness(.92); opacity:.72;}
/* 进行中：电量环点亮 + 豆腐块上色发光 */
.task-row.running .ring-fg{stroke:var(--theme,#3b82f6); filter:drop-shadow(0 0 5px var(--glow2));}
.task-row.running .tofu{filter:none; opacity:1;}
/* 完成：电量环满绿，豆腐块变绿 */
.task-row.done .ring-fg{stroke:var(--green); filter:drop-shadow(0 0 6px rgba(16,185,129,.75));}
.task-row.done .tofu{background:linear-gradient(145deg,#6ee7b7,#10b981 60%,#059669);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.45), 0 5px 14px rgba(16,185,129,.45);}
.task-row.done .ring-txt{color:#fff;}
/* 失败：电量环标红，豆腐块变红 */
.task-row.err .ring-fg{stroke:var(--red); filter:drop-shadow(0 0 6px rgba(244,63,94,.72));}
.task-row.err .tofu{background:linear-gradient(145deg,#fb7185,#e11d48 60%,#be123c);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.4), 0 5px 14px rgba(225,29,72,.4);}
.task-row.err .ring-txt{color:#fff;}
.card[data-kind="install"] .ring-fg{--theme:var(--green);}
.card[data-kind="uninstall"] .ring-fg{--theme:var(--red);}
.task-row .tmid{flex:1 1 auto; min-width:0; width:100%; text-align:center;}
.task-row .tname{font-size:10.5px; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.task-row .tstat{font-size:9.5px; color:var(--dim); margin-top:2px;}
.task-row.done .tstat{color:var(--green-deep);}
.task-row.err .tstat{color:var(--red-deep);}
/* 百分比数字由方块内的环形进度直接表达，右侧不再重复展示 */
.task-row .tpct{display:none;}

/* 进度行（带流光） */
.progress-wrap{display:none; flex-direction:column; gap:8px; width:86%;}
.progress-wrap.show{display:flex;}
.fname{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.bar{
  height:6px;border-radius:99px;background:var(--track-bg);overflow:hidden;position:relative;
}
.bar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;}
.bar>i::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
  background-size:200% 100%; animation:shimmer 1.8s linear infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.card[data-kind="install"] .bar>i{background:linear-gradient(90deg,#10b981,#34d399); box-shadow:0 0 10px rgba(16,185,129,.7);}
.card[data-kind="uninstall"] .bar>i{background:linear-gradient(90deg,#f43f5e,#fb7185); box-shadow:0 0 10px rgba(244,63,94,.7);}

/* uiverse 风格 loading spinner */
.spin{width:22px;height:22px;border-radius:50%;margin:0 auto;
  border:3px solid var(--track-bg); border-top-color:currentColor;
  animation:rot .8s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.loading-row{display:none;align-items:center;gap:10px;color:var(--dim);font-size:12px;}
.loading-row.show{display:flex;}

/* 结果徽章 */
.badge{
  display:none; align-items:center; gap:7px; font-size:13px; font-weight:700;
  padding:7px 14px;border-radius:12px;
}
.badge.show{display:inline-flex; animation:badgeIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes badgeIn{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
.badge.ok{color:var(--green-deep); background:rgba(16,185,129,.13); box-shadow:inset 0 0 0 1px rgba(16,185,129,.45);}
.badge.err{color:var(--red-deep); background:rgba(244,63,94,.13); box-shadow:inset 0 0 0 1px rgba(244,63,94,.45);}
.badge.warn{color:var(--amber);background:rgba(251,191,36,.13); box-shadow:inset 0 0 0 1px rgba(251,191,36,.45);}

.foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}

/* ============ uiverse iOS Toggle（弹性滑块） ============ */
.tgl-label{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim);cursor:pointer;}
.switch-box{width:42px;height:25px;position:relative;flex:none;}
.switch-box input{opacity:0;width:0;height:0;position:absolute;}
.slider{width:100%;height:100%;display:block;background:var(--switch-off);border-radius:16px;
  cursor:pointer;transition:background .3s cubic-bezier(.4,0,.2,1), box-shadow .3s; box-shadow:inset 0 0 0 1px var(--btn-inset);}
.knob{width:21px;height:21px;position:absolute;left:2px;top:2px;border-radius:50%;
  background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.35); transition:left .3s cubic-bezier(.34,1.56,.64,1), transform .3s;}
.switch-box input:checked + .slider{background:#34d399; box-shadow:inset 0 0 0 1px rgba(16,185,129,.3), 0 0 12px rgba(52,211,153,.35);}
.switch-box input:checked + .slider + .knob{left:19px; transform:scale(1.05);}
.switch-box input:active + .slider + .knob{transform:scale(.85);}
.switch-box input:checked:active + .slider + .knob{left:17px; transform:scale(.9);}
.tgl-label:hover .sw-txt{color:var(--ink);}
.tgl-label .sw-txt{transition:color .2s; user-select:none;}

/* ============ 日志面板 ============ */
.logpanel{
  position:relative; z-index:3; margin:6px 22px 0; border-radius:16px;
  background:var(--panel-bg); border:1px solid var(--card-border);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  overflow:hidden; display:flex; flex-direction:column;
  flex:1 1 auto; min-height:150px;
  box-shadow:0 12px 30px var(--shadow-soft), inset 0 1px 0 var(--card-inset);
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1) .2s both;
}
.log-bar{
  display:flex;align-items:center;gap:8px;padding:9px 14px;
  font-size:12px;font-weight:700;color:var(--blue-deep);letter-spacing:.5px;
  border-bottom:1px solid var(--header-line);
}
.log-bar .clear{margin-left:auto;cursor:pointer;color:var(--dim);font-weight:500;font-size:11.5px;
  transition:color .2s, transform .2s; border:none;background:transparent;font-family:inherit;padding:2px 6px;border-radius:6px;}
.log-bar .clear:hover{color:var(--red-deep); transform:scale(1.06);}
#log{flex:1 1 auto;min-height:96px;overflow-y:auto;padding:8px 14px;font-family:Consolas,"Courier New",monospace;font-size:11.8px;line-height:1.7;}
#log::-webkit-scrollbar{width:6px;}
#log::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;}
.lg{white-space:pre-wrap;word-break:break-all; animation:logIn .3s ease both;}
@keyframes logIn{0%{opacity:0;transform:translateY(4px);}100%{opacity:1;transform:translateY(0);}}
.lg .t{color:var(--faint);}
.lg .ok{color:var(--green-deep);}
.lg .err{color:var(--red-deep);}
.lg .warn{color:var(--amber);}
.lg .info{color:var(--dim);}
.lg .acc{color:var(--blue-deep);}

footer{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 22px 13px;font-size:11.5px;color:var(--faint);flex:0 0 auto;}
footer .fp{letter-spacing:.3px;}
footer .tgl-label{font-size:11.5px;color:var(--dim);}
footer .switch-box{width:36px;height:21px;transform:scale(.92);transform-origin:right center;}
footer .switch-box .knob{width:17px;height:17px;}
footer .switch-box input:checked + .slider + .knob{left:17px;}
.tgl-label .sw-txt{user-select:none;}

/* ============ uiverse 玻璃 toast（弹性滑入） ============ */
#toast{
  position:fixed;top:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:10px;
}
.toast{
  min-width:240px;max-width:340px;padding:13px 16px;border-radius:14px;
  background:var(--toast-bg); border:1px solid var(--card-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 34px var(--shadow-soft), inset 0 1px 0 var(--toast-inset);
  font-size:12.5px; color:var(--ink);
  transform:translateX(130%); transition:transform .5s cubic-bezier(.2,.8,.2,1); display:block;
}
.toast.in{transform:translateX(0);}
.toast.out{transform:translateX(130%);}
.toast b{font-weight:700;}
.toast.ok{border-color:rgba(16,185,129,.55); box-shadow:0 14px 34px var(--shadow-soft), 0 0 26px rgba(16,185,129,.2);}
.toast.err{border-color:rgba(244,63,94,.55); box-shadow:0 14px 34px var(--shadow-soft), 0 0 26px rgba(244,63,94,.2);}

/* ============ iOS 风格应用网格（快速版：首字彩色图标） ============ */
.card.appcard{grid-column:1 / -1; animation-delay:.08s;}
.pill.apps{background:rgba(59,130,246,.12);color:var(--blue-deep);box-shadow:inset 0 0 0 1px rgba(59,130,246,.45);}
.appgrid{
  display:flex;flex-wrap:wrap;gap:14px 16px;align-content:flex-start;
  max-height:200px;overflow-y:auto;padding:6px 4px 2px;margin-top:2px;
}
.appgrid::-webkit-scrollbar{width:5px;}
.appgrid::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;}
.apps-empty{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:12.5px;padding:18px 0;}
.apps-hint{font-size:11px;color:var(--faint);margin-top:6px;text-align:center;user-select:none;}
.apps-hint b{color:var(--red-deep);}
.app-item{
  position:relative;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;user-select:none;border-radius:14px;padding:4px 2px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), opacity .3s;
}
.app-item:hover{transform:scale(1.05);}
.app-ico{
  width:58px;height:58px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.22), inset 0 2px 3px rgba(255,255,255,.42), 0 6px 16px rgba(15,23,42,.22);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), filter .25s;
}
.app-ico span{font-size:23px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1;}
.app-name{font-size:10px;color:var(--ink);max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.app-name.pending{color:#93a1b5;font-family:ui-monospace,Consolas,monospace;font-size:9px;}
/* 编辑模式：抖动 + 显示 × */
.appcard.editing .app-item{animation:wiggle .9s ease-in-out infinite;transform-origin:50% 62%;}
.appcard.editing .app-item:nth-child(odd){animation-delay:.1s;}
.appcard.editing .app-item:nth-child(3n){animation-delay:.2s;}
@keyframes wiggle{0%,100%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}}
.xbtn{
  position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--red-deep);color:#fff;font-size:10.5px;font-weight:800;line-height:20px;text-align:center;
  box-shadow:0 2px 6px rgba(225,29,72,.5), inset 0 0 0 1px rgba(255,255,255,.35);
  opacity:0;transform:scale(.3);transition:opacity .18s, transform .25s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;z-index:2;
}
.appcard.editing .xbtn{opacity:1;transform:scale(1);}
.xbtn:active{transform:scale(.85);}
/* 删除成功：iOS 式缩放消失 */
.app-item.removing{animation:appRemove .45s cubic-bezier(.36,.07,.19,.97) forwards;pointer-events:none;}
@keyframes appRemove{0%{transform:scale(1);opacity:1;}40%{transform:scale(1.14) rotate(5deg);opacity:1;}100%{transform:scale(.08);opacity:0;}}
/* iOS 风格确认弹层 */
#iosSheet{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
#iosSheet.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{width:292px;background:rgba(255,255,255,.97);border-radius:18px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.32);animation:sheetIn .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes sheetIn{0%{transform:scale(.82);opacity:0;}100%{transform:scale(1);opacity:1;}}
.sheet .s-body{padding:22px 18px 18px;text-align:center;}
.sheet .s-name{font-size:16px;font-weight:700;color:var(--ink);}
.sheet .s-pkg{font-size:11px;color:var(--dim);margin-top:5px;word-break:break-all;}
.sheet .s-btn{display:block;width:100%;border:none;background:transparent;padding:12.5px;font-size:15px;font-weight:600;cursor:pointer;border-top:1px solid rgba(29,38,53,.1);font-family:inherit;transition:background .15s;}
.sheet .s-btn:hover{background:rgba(15,23,42,.04);}
.sheet .s-btn.del{color:var(--red-deep);}
.sheet .s-btn.cancel{color:var(--dim);font-weight:500;}

/* ============ 小窗口自适应 ============
   窗口最小可缩至 680×600（原为 840×930，等于不可缩放）。
   双列卡片在窄窗下会相互挤压，矮窗下日志面板的 min-height 会把内容顶出
   可视区（body 是 overflow:hidden），故按宽度/高度两个维度分别收窄。 */
@media (max-width: 820px){
  header{padding:12px 14px 10px; gap:10px;}
  header h1{font-size:17px;}
  .logo{width:34px;height:34px;border-radius:11px;font-size:16px;}
  main{padding:6px 14px 8px; gap:12px;}
  .card{padding:16px 16px 14px; border-radius:16px;}
  .logpanel{margin:6px 14px 0;}
  footer{padding:8px 14px 10px;}
}
@media (max-width: 700px){
  /* 单列堆叠，避免 dropzone 内文字换行挤爆；堆叠后高度可能超出，改为整块滚动。
     min-height:0 是关键：flex 子项默认 min-height:auto 会拒绝收缩，导致被截断。
     同时把日志面板从「抢剩余空间」改为固定较矮，避免和主区互相压缩。 */
  main{grid-template-columns:1fr; overflow-y:auto; min-height:0; flex:1 1 auto;}
  .logpanel{flex:0 0 auto; min-height:110px;}
}
@media (max-height: 820px){
  .logpanel{min-height:110px;}
  #log{min-height:64px; line-height:1.55;}
}
@media (max-height: 700px){
  header{padding:10px 14px 8px;}
  .logpanel{min-height:84px;}
  #log{min-height:44px;}
  footer{display:none;}               /* 矮窗优先给主功能留高度 */
}
</style>
</head>
<body>

<header>
  <div class="logo">APK</div>
  <div>
    <h1>APK 管家</h1>
    <div class="sub">拖入即装 · adb 直连，绕开应用宝「高风险」拦截</div>
  </div>
  <div class="status" id="statusChip">
    <span class="dot" id="stDot"></span>
    <div>
      <div class="st-txt" id="stTxt">检测中…</div>
      <div class="st-addr" id="stAddr">127.0.0.1:5555</div>
    </div>
    <button class="emu-start" id="btnStartEmu" title="启动应用宝模拟器">启动模拟器</button>
    <span class="refresh" id="btnRefresh" title="重新检测模拟器">⟳</span>
  </div>
</header>

<main>
  <!-- ====== 安装卡 ====== -->
  <section class="card" data-kind="install" id="cardInstall">
    <div class="card-head">
      <span class="pill green">INSTALL</span>
      <span class="card-title">安装 APK</span>

      <button class="glass-btn" id="btnPickInstall">选择文件</button>
    </div>
    <div class="dropzone" id="dzInstall">
      <div class="dz-placeholder" id="phInstall">
        <div class="dz-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 20h16"/></svg></div>
        <div class="dz-main">拖入 .apk 文件</div>
        <div class="dz-sub">放下即自动 adb 安装（覆盖更新）</div>
      </div>
      <div class="tlist" id="tlistInstall"></div>
      <div class="progress-wrap" id="progInstall">
        <div class="fname" id="fnameInstall"></div>

    <div class="foot">

        覆盖安装（-r 保留数据）

    <div class="dropzone" id="dzUninstall">
      <div class="dz-placeholder" id="phUninstall">

        <div class="dz-main">拖入已安装的 .apk</div>
        <div class="dz-sub">自动解析包名后移除</div>
      </div>

  <!-- ====== 已安装应用（iOS 风格快速版） ====== -->

</main>

<!-- ====== 日志 ====== -->
<section class="logpanel">
  <div class="log-bar">
    <span>运行日志</span>

</section>

<footer>
  <label class="tgl-label">
    <span class="switch-box">
      <input type="checkbox" id="swAutoEmu" checked>
      <span class="slider"></span>
      <span class="knob"></span>
    </span>
    <span class="sw-txt">启动时自动拉起模拟器</span>
  </label>
  <span class="fp">保持应用宝模拟器运行中 · APK 管家 3.0</span>
</footer>

<div id="toast"></div>

<!-- iOS 风格确认弹层 -->
<div id="iosSheet">
  <div class="sheet">
    <div class="s-body">
      <div class="s-name" id="sheetName"></div>
      <div class="s-pkg" id="sheetPkg"></div>
    </div>
    <button class="s-btn del" id="btnSheetDelete">卸载</button>
    <button class="s-btn cancel" id="btnSheetCancel">取消</button>
  </div>
</div>

<script>
'use strict';
/* ================= 全局状态 ================= */
var App = window.App = {
  busy: {},
  installQueue: [],        // [{path,name}...]
  uninstallQueue: [],
  processing: false,
};

/* ================= 工具 ================= */
function $(id){return document.getElementById(id);}
function tstamp(){var d=new Date();function p(n){return (n<10?'0':'')+n};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

function log(msg, cls, stamp){
  var el = $('log'); var div = document.createElement('div');
  div.className = 'lg';
  div.innerHTML = '<span class="t">[' + (stamp||tstamp()) + '] </span><span class="' + (cls||'info') + '">' + esc(msg) + '</span>';
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
// 从 Python 推送的日志统一走这里
window.__log = function(text, cls){ log(text, cls||'info'); };

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ================= Toast ================= */
function toast(html, kind){
  var t = document.createElement('div');
  t.className = 'toast ' + (kind||'ok');
  t.innerHTML = html;
  $('toast').appendChild(t);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.classList.add('in'); }); });
  setTimeout(function(){ t.classList.remove('in'); t.classList.add('out');
    setTimeout(function(){ t.remove(); }, 550); }, 2800);
}

/* ================= 按钮涟漪效果（uiverse 交互反馈） ================= */
function ripple(e){
  var btn = e.currentTarget;
  var rect = btn.getBoundingClientRect();
  var r = document.createElement('span');
  var size = Math.max(rect.width, rect.height);
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size/2) + 'px';
  r.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(r);
  setTimeout(function(){ r.remove(); }, 600);
}
document.querySelectorAll('.glass-btn, .emu-start').forEach(function(b){
  b.addEventListener('pointerdown', ripple);
});

/* ================= 状态徽章 ================= */
function badgeShow(which, text, cls){
  var b = $(which); b.className = 'badge show ' + cls; b.innerHTML = esc(text);
  clearTimeout(b._t); b._t = setTimeout(function(){ b.className='badge'; }, 5000);
}

/* ================= 进度 ================= */
function prog(kind, state, text, pct){
  var suffix = kind === 'install' ? 'Install' : 'Uninstall';
  var pw = $('prog' + suffix), lr = $('loading' + suffix);
  if (state === 'loading'){
    pw.classList.remove('show'); lr.classList.add('show');
    $('loadingText' + suffix).textContent = text || '处理中…';
  } else if (state === 'bar'){
    lr.classList.remove('show'); pw.classList.add('show');
    $('fname' + suffix).textContent = text || '';
    $('bar' + suffix).style.width = (pct||0) + '%';
  } else { // idle
    pw.classList.remove('show'); lr.classList.remove('show');
  }
}

/* ================= 任务级进度（多任务并行，图标由灰渐亮） ================= */
window.__task = function(kind, id, name, pct, state, statusText){
  var cap = kind === 'install' ? 'Install' : 'Uninstall';
  var list = $('tlist' + cap), ph = $('ph' + cap);
  var row = $('task_' + id);
  if (!row){
    row = document.createElement('div');
    row.id = 'task_' + id;
    row.className = 'task-row pending';
    row.innerHTML =
      '<div class="ringbox">' +
        '<svg viewBox="0 0 64 64">' +
          '<circle class="ring-bg" cx="32" cy="32" r="30"/>' +
          '<circle class="ring-fg" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>' +
        '</svg>' +
        '<div class="tofu"><span class="ring-txt"></span></div>' +
      '</div>' +
      '<div class="tmid"><div class="tname">' + esc(name) + '</div><div class="tstat">' + esc(statusText||'等待中…') + '</div></div>' +
      '<div class="tpct">0%</div>';
    list.appendChild(row);
    ph.classList.add('hide');
    list.classList.add('show');
  }
  var fg = row.querySelector('.ring-fg'), txt = row.querySelector('.ring-txt'),
      p = row.querySelector('.tpct'), st = row.querySelector('.tstat');
  pct = Math.max(0, Math.min(100, Math.round(pct||0)));
  if (state === 'done' || state === 'err'){
    if (row._anim){ clearInterval(row._anim); row._anim = null; }
    pct = 100;
    row.classList.remove('pending','running');
    row.classList.add(state==='done'?'done':'err');
    txt.innerHTML = state==='done' ? '✓' : '✗';
    if (statusText) st.textContent = statusText;
    fg.style.strokeDashoffset = '0';
    p.textContent = '100%';
    clearTimeout(row._rm);
    row._rm = setTimeout(function(){
      row.classList.add('leave');
      setTimeout(function(){
        row.remove();
        if (list.children.length === 0){ list.classList.remove('show'); ph.classList.remove('hide'); }
      }, 500);
    }, 6000);
  } else {
    row.classList.remove('pending');
    row.classList.add('running');
    fg.style.strokeDashoffset = (188.5 * (1 - pct/100)).toFixed(2);
    txt.textContent = pct + '%';
    p.textContent = pct + '%';
    if (statusText) st.textContent = statusText;
    // 后端 push 阶段推送真实百分比；pm install 阶段在此平滑补足，模拟手机安装动画
    if (!row._anim && pct < 82){
      var cur = pct;
      row._anim = setInterval(function(){
        if (!row || row._rm){ clearInterval(row._anim); row._anim = null; return; }
        cur = Math.min(82, cur + 1.1);
        fg.style.strokeDashoffset = (188.5 * (1 - cur/100)).toFixed(2);
        var shown = Math.min(82, Math.round(cur));
        txt.textContent = shown + '%';
        p.textContent = shown + '%';
        if (cur >= 82){ clearInterval(row._anim); row._anim = null; }
      }, 240);
    }
  }
};

/* ================= adb 连接状态推送（Python 调用） ================= */
window.__adb = function(ok, msg, addr){
  var d = $('stDot');
  d.className = 'dot ' + (ok ? 'on' : 'off');
  $('stTxt').textContent = msg || (ok ? '模拟器在线' : '模拟器离线');
  if (addr) $('stAddr').textContent = addr;
  var b = $('btnStartEmu');
  if (!b) return;
  b.classList.remove('on', 'busy');
  if (ok){
    b.classList.add('on'); b.innerHTML = '已在线';
  } else if (msg && msg.indexOf('正在启动') >= 0){
    b.classList.add('busy'); b.innerHTML = '<span class="spin-mini"></span>启动中…';
  } else {
    b.innerHTML = '启动模拟器';
  }
};
/* Python 后台启动过程实时 busy 态（解耦轮询推送） */
window.emuBusy = function(b){
  var el = $('btnStartEmu');
  if (!el) return;
  el.classList.toggle('busy', !!b);
  if (b && !el.classList.contains('on')) el.innerHTML = '<span class="spin-mini"></span>启动中…';
};

/* ================= 拖放（由 Python DOM 桥绑定 drop） ================= */
function disableNativeDrop(){ // 防止拖到空白处浏览器打开文件
  ['dragover','drop'].forEach(function(ev){
    window.addEventListener(ev, function(e){ e.preventDefault(); });
  });
}
disableNativeDrop();

/* ================= 选择文件按钮 + 刷新（调用 Python API） ================= */
var btnPickInstall = $('btnPickInstall'), btnPickUninstall = $('btnPickUninstall');
btnPickInstall.addEventListener('click', function(){
  if (window.pywebview && window.pywebview.api && window.pywebview.api.pick){
    window.pywebview.api.pick('install');
  } else { toast('后端未就绪，请稍候', 'err'); }
});
btnPickUninstall.addEventListener('click', function(){
  if (window.pywebview && window.pywebview.api && window.pywebview.api.pick){
    window.pywebview.api.pick('uninstall');
  } else { toast('后端未就绪，请稍候', 'err'); }
});

/* ================= 拖放高亮（drop 由 Python DOM 桥处理） ================= */
function bindDZ(zoneId){
  var z = $(zoneId);
  if (!z) return;
  z.addEventListener('dragenter', function(e){ e.preventDefault(); z.classList.add('drag-on'); });
  z.addEventListener('dragover',  function(e){ e.preventDefault(); z.classList.add('drag-on'); });
  z.addEventListener('dragleave', function(e){
    if (e.relatedTarget === null || !z.contains(e.relatedTarget)) z.classList.remove('drag-on');
  });
  z.addEventListener('drop', function(){
    z.classList.remove('drag-on');
    z.classList.remove('drop-bump');
    void z.offsetWidth;                 // 强制重排，重启动画
    z.classList.add('drop-bump');
    setTimeout(function(){ z.classList.remove('drop-bump'); }, 580);
  });
}
bindDZ('dzInstall');
bindDZ('dzUninstall');

/* ================= iOS 风格应用网格（快速版） ================= */
var appGrid=$('appGrid'), appsEditing=false, sheetPkg=null, sheetItem=null;
var APP_GRADS=[
  'linear-gradient(145deg,#4cc9f0,#3b82f6 60%,#8b5cf6)',
  'linear-gradient(145deg,#34d399,#10b981 60%,#059669)',
  'linear-gradient(145deg,#fb7185,#f43f5e 60%,#e11d48)',
  'linear-gradient(145deg,#fbbf24,#f59e0b 60%,#d97706)',
  'linear-gradient(145deg,#a78bfa,#8b5cf6 60%,#7c3aed)',
  'linear-gradient(145deg,#38bdf8,#0ea5e9 60%,#0284c7)',
  'linear-gradient(145deg,#f472b6,#ec4899 60%,#db2777)',
  'linear-gradient(145deg,#2dd4bf,#14b8a6 60%,#0d9488)'
];
function appGrad(pkg){var h=0;for(var i=0;i<pkg.length;i++){h=(h*31+pkg.charCodeAt(i))>>>0;}return APP_GRADS[h%APP_GRADS.length];}

function enterAppsEdit(){
  if(appsEditing) return;
  appsEditing=true;
  $('cardApps').classList.add('editing');
  $('btnAppsDone').style.display='';
  $('appsHint').style.display='';
}
function exitAppsEdit(){
  appsEditing=false;
  $('cardApps').classList.remove('editing');
  $('btnAppsDone').style.display='none';
  $('appsHint').style.display='none';
}

function loadApps(){
  if(!(window.pywebview&&window.pywebview.api&&window.pywebview.api.get_apps)){
    appGrid.innerHTML='<div class="apps-empty">后端未就绪</div>'; return;
  }
  appGrid.innerHTML='<div class="apps-empty"><span class="spin"></span>正在读取应用列表…</div>';
  window.pywebview.api.get_apps().then(function(apps){
    renderApps(apps||[]);
  }).catch(function(e){
    appGrid.innerHTML='<div class="apps-empty">读取失败：'+esc(String((e&&e.message)||e))+'</div>';
  });
}
function icoChar(label,pkg){
  var t=String(label||pkg||'?').trim();
  var ch=t.charAt(0);
  return /[a-z]/.test(ch)?ch.toUpperCase():ch;
}
function renderApps(apps){
  appGrid.textContent='';
  exitAppsEdit();
  if(!apps.length){
    var empty=document.createElement('div');
    empty.className='apps-empty';
    empty.textContent='未安装第三方应用';
    appGrid.appendChild(empty);
    $('appsCount').textContent='0 个应用';
    return;
  }
  $('appsCount').textContent=apps.length+' 个应用 · 长按管理';
  var i=0;
  (function step(){                       // 每片 40 个，应用上百也不卡首屏
    var end=Math.min(i+40,apps.length);
    for(;i<end;i++){ appGrid.appendChild(buildAppItem(apps[i])); }
    if(i<apps.length) setTimeout(step,0); // 定时器切片：窗口不可见时也不会卡住
  })();
}
function buildAppItem(a){
  var item=document.createElement('div');
  item.className='app-item';
  item.setAttribute('data-pkg',a.pkg);
  var ico=document.createElement('div');
  ico.className='app-ico';
  ico.style.background=appGrad(a.pkg);
  var ch=document.createElement('span');
  ch.textContent=icoChar(a.label,a.pkg);
  ico.appendChild(ch);
  var x=document.createElement('span');
  x.className='xbtn'; x.title='卸载';
  x.addEventListener('pointerdown',function(e){e.stopPropagation();});
  x.addEventListener('click',function(e){ e.stopPropagation(); onAppX(e,a.pkg,a.label||a.pkg,item); });
  var nm=document.createElement('div');
  nm.className='app-name';
  nm.textContent=a.label||a.pkg;          // 名字未解析出来时先显示包名
  nm.title=a.pkg;
  if(!a.label) nm.className+=' pending';
  item.appendChild(ico); item.appendChild(x); item.appendChild(nm);
  bindAppItem(item);
  return item;
}
window.__appsNames=function(names){       // 后端解析出一批应用名就地更新，不重排列表
  if(!names) return;
  Object.keys(names).forEach(function(pkg){
    var name=names[pkg];
    if(!name) return;
    var item=appGrid.querySelector('[data-pkg="'+pkg.replace(/"/g,'\\"')+'"]');
    if(!item) return;
    var nm=item.querySelector('.app-name');
    if(nm){ nm.textContent=name; nm.title=pkg; nm.classList.remove('pending'); }
    var ch=item.querySelector('.app-ico span');
    if(ch) ch.textContent=icoChar(name,pkg);
  });
};

function bindAppItem(item){
  var sx=0,sy=0,hold=null,longPressed=false;
  item.addEventListener('pointerdown',function(e){
    if(appsEditing||(e.button!==undefined&&e.button!==0)) return;
    sx=e.clientX; sy=e.clientY; longPressed=false;
    hold=setTimeout(function(){ longPressed=true; enterAppsEdit(); },500);
  });
  item.addEventListener('pointermove',function(e){
    if(hold&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){clearTimeout(hold);hold=null;}
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    item.addEventListener(ev,function(){ if(hold){clearTimeout(hold);hold=null;} });
  });
  item.addEventListener('click',function(){ if(appsEditing&&!longPressed){ exitAppsEdit(); } });
}
function onAppX(e,pkg,label,item){
  $('sheetName').textContent=label||pkg;
  $('sheetPkg').textContent=pkg;
  sheetPkg=pkg; sheetItem=item;
  $('iosSheet').classList.add('show');
}
$('btnSheetCancel').addEventListener('click',function(){
  $('iosSheet').classList.remove('show');
});
$('btnSheetDelete').addEventListener('click',function(){
  $('iosSheet').classList.remove('show');
  var pkg=sheetPkg,item=sheetItem; sheetPkg=null; sheetItem=null;
  if(!pkg) return;
  if(!(window.pywebview&&window.pywebview.api&&window.pywebview.api.uninstall_pkg)){
    toast('后端未就绪','err'); return;
  }
  window.pywebview.api.uninstall_pkg(pkg).then(function(r){
    if(r&&r.ok){
      item.classList.add('removing');
      setTimeout(function(){ loadApps(); },460);
    } else {
      toast('卸载失败：'+esc((r&&r.msg)||'未知错误'),'err');
    }
  });
});
$('btnAppsRefresh').addEventListener('click',loadApps);
$('btnAppsDone').addEventListener('click',exitAppsEdit);
appGrid.addEventListener('pointerdown',function(e){
  if(appsEditing&&e.target===appGrid){ exitAppsEdit(); }
});
window.addEventListener('pywebviewready',function(){ loadApps(); });
</script>
